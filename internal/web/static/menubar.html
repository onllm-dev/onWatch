            // tooltip suffix. Empty for a healthy ("ok") or absent status so
            // normal quotas stay uncluttered; an unknown value is shown as-is.
            function quotaStatusNote(quota) {
                const label = quota.status_label;
                if (!label || String(label).toLowerCase() === "ok") return "";
                return ` - ${label}`;
            }

            function usageSummary(quota) {
                // Percent-only quotas (OpenCode key mode) report a bare percent
                // with a synthetic limit of 100. Showing "8/100 used" would be a
                // fake fraction, so no usage line is drawn: the ring already
                // carries the percent, exactly as for a quota with no used/limit.
                if (quota.percent_only) {
                    return "";
                }
                const limit = Number(quota.limit);
                const used = Number(quota.used);
                if (Number.isFinite(limit) && limit > 0 && Number.isFinite(used) && used >= 0) {
                    if (quota.format === "currency") {
                        if (quota.currency && quota.currency !== "USD") {
 try {const fmt=new Intl.NumberFormat(undefined,{style:"currency",currency:quota.currency});return `${fmt.format(used)}/${fmt.format(limit)}`;} catch {return `${formatUsd(used)}/${formatUsd(limit)} ${quota.currency}`;}
 }
 return `$${formatUsd(used)}/$${formatUsd(limit)}`;
                    }
                    if (quota.format === "credits") {
                        return `${formatCredits(used)}/${formatCredits(limit)} cr`;
                    }
                    return `${Math.round(used)}/${Math.round(limit)}`;
                }
                return "";
            }

            function formatCredits(value) {
                const numeric = Number(value);
                if (!Number.isFinite(numeric)) {
                    return "0.00";
                }
                return numeric.toFixed(2);
            }

            function formatRate(value) {
                const numeric = Number(value);
                if (!Number.isFinite(numeric) || numeric <= 0) {
                    return "0";
                }
                const digits = numeric < 10 ? 2 : numeric < 100 ? 1 : 0;
                return new Intl.NumberFormat("en-US", {
                    minimumFractionDigits: digits,
                    maximumFractionDigits: digits
                }).format(numeric);
            }

            function formatAbsoluteReset(value) {
                const text = String(value || "").trim();
                if (!text) {
                    return "--";
                }
                const date = new Date(text);
                if (Number.isNaN(date.getTime())) {
                    return text;
                }
                return new Intl.DateTimeFormat("en-US", {
                    month: "short",
                    day: "numeric",
                    hour: "numeric",
                    minute: "2-digit"
                }).format(date);
            }

            function compactUpdatedLabel(value) {
                const label = compactTimeLabel(value);
                return label === "0m" ? "now" : label;
            }

            // ageLabelFromTimestamp renders an age from a raw RFC3339 timestamp
            // against this client's wall clock, so it keeps counting up even when
            // the daemon is unreachable. Falls back to the server's pre-rendered
            // string when no timestamp is available.
            function ageLabelFromTimestamp(raw, fallback) {
                if (!raw) {
                    return compactUpdatedLabel(fallback);
                }
                const then = Date.parse(raw);
                // Reject unparseable, non-positive, and absurdly old timestamps.
                // A zero time.Time serializes as 0001-01-01, which would read as
                // hundreds of thousands of days; fall back instead.
                const minValid = Date.UTC(2000, 0, 1);
                if (!Number.isFinite(then) || then <= 0 || then < minValid) {
                    return compactUpdatedLabel(fallback);
                }
                const seconds = Math.max(0, (Date.now() - then) / 1000);
                if (seconds < 60) {
                    return "now";
                }
                if (seconds < 3600) {
                    return Math.floor(seconds / 60) + "m";
                }
                if (seconds < 86400) {
                    return Math.floor(seconds / 3600) + "h";
                }
                return Math.floor(seconds / 86400) + "d";
            }

            // providerAgeLabel counts from the provider's own last successful
            // data time (updated_at_time), not the snapshot build time.
            function providerAgeLabel(provider) {
                if (!provider) {
                    return "--";
                }
                return ageLabelFromTimestamp(provider.updated_at_time || provider.updatedAtTime, provider.updated_at);
            }

            function compactResetLabel(quota) {
                return compactTimeLabel(quota.time_until_reset || quota.reset_at);
            }

            function compactTimeLabel(value) {
                const text = String(value || "").trim();
                if (!text) {
                    return "--";
                }
                const normalized = text
                    .replace(/\s+ago$/i, "")
                    .replace(/\s+minutes?$/i, "m")
                    .replace(/\s+hours?$/i, "h")
                    .replace(/\s+days?$/i, "d")
                    .replace(/\s+day$/i, "d")
                    .replace(/\s+hour$/i, "h")
                    .replace(/\s+minute$/i, "m");
                if (normalized.toLowerCase() === "just now" || normalized === "0m") {
                    return "now";
                }
                return normalized;
            }

            // quotaLabelSemantic maps a quota's key/label to a known short name,
            // or "" when nothing matches. Shared by the truncating compact label
            // and the wrapping full label so both agree on the wording.
            function quotaLabelSemantic(label, key) {
                const source = `${String(key || "").toLowerCase()} ${String(label || "").toLowerCase()}`;
                if (source.includes("weekly sonnet") || source.includes("weekly_sonnet")) {
                    return "Wkly Son";
                }
                if (source.includes("weekly all-model") || source.includes("weekly all") || source.includes("weekly_all-model") || source.includes("seven_day")) {
                    return "Wkly All";
                }
                if (source.includes("5-hour") || source.includes("5-hour_limit") || source.includes("five_hour")) {
                    return "5hr";
                }
                if (source.includes("review")) {
                    return "Review";
                }
                if (source.includes("claude + gpt") || source.includes("claude_+_gpt")) {
                    return "Cl+GPT";
                }
                if (source.includes("3.1 flash lite") || source.includes("3.1_flash_lite")) {
                    return "3.1 FLite";
                }
                if (source.includes("2.5 flash lite") || source.includes("2.5_flash_lite") || source.includes("2.5-flash-lite")) {
                    return "2.5 FLite";
                }
                if (source.includes("3 flash") || source.includes("3-flash")) {
                    return "3 Flash";
                }
                if (source.includes("2.5 flash") || source.includes("2.5-flash")) {
                    return "2.5 Flash";
                }
                if (source.includes("3 pro") || source.includes("3-pro")) {
                    return "3 Pro";
                }
                if (source.includes("2.5 pro") || source.includes("2.5-pro")) {
                    return "2.5 Pro";
                }
                if (source.includes("gemini flash lite") || source.includes("gemini_flash_lite")) {
                    return "F Lite";
                }
                if (source.includes("gemini flash")) {
                    return "Flash";
                }
                if (source.includes("gemini pro")) {
                    return "Pro";
                }
                if (source.includes("wkly coding") || source.includes("wkly_coding") || source.includes("weekly_minimax coding") || source.includes("weekly all")) {
                    return "Wkly Coding";
                }
                if (source.includes("wkly image") || source.includes("wkly_image") || source.includes("weekly_image") || source.includes("weekly image")) {
                    return "Wkly Image";
                }
                if (source.includes("wkly music") || source.includes("wkly_music") || source.includes("weekly_music") || source.includes("weekly music")) {
                    return "Wkly Music";
                }
                if (source.includes("wkly speech") || source.includes("wkly_speech") || source.includes("weekly_speech") || source.includes("weekly speech")) {
                    return "Wkly Speech";
                }
                if (source.includes("coding")) {
                    return "Coding";
                }
                if (source.includes("image")) {
                    return "Image";
                }
                if (source.includes("music")) {
                    return "Music";
                }
                if (source.includes("speech")) {
                    return "Speech";
                }
                if (source.includes("subscription")) {
                    return "Sub";
                }
                if (source.includes("search")) {
                    return "Search";
                }
                if (source.includes("toolcall") || source.includes("tool call")) {
                    return "Tools";
                }
                if (source.includes("completions")) {
                    return "Comp";
                }
                if (source.includes("tokens")) {
                    return "Tok";
                }
                if (source.includes("requests")) {
                    return "Req";
                }
                return "";
            }

            function compactQuotaLabel(label, key) {
                const semantic = quotaLabelSemantic(label, key);
                if (semantic) {
                    return semantic;
                }
                const text = String(label || key || "Quota").trim();
                return text.length > 10 ? text.slice(0, 10) : text;
            }

            // fullQuotaLabel is the wrapping tile label: it keeps the semantic
            // short names but never hard-truncates, so "Weekly Credits" and
            // "Gemini Weekly" read in full. Claude + GPT windows keep their
            // window suffix ("Cl+GPT Weekly").
            function fullQuotaLabel(quota) {
                const label = String(quota && quota.label || "").trim();
                const key = String(quota && quota.key || "");
                const source = `${key.toLowerCase()} ${label.toLowerCase()}`;
                if (source.includes("claude + gpt") || source.includes("claude_+_gpt")) {
                    return label.replace(/claude\s*\+\s*gpt/i, "Cl+GPT");
                }
                const semantic = quotaLabelSemantic(label, key);
                if (semantic) {
                    return semantic;
                }
                return label || key || "Quota";
            }

            function compactProviderName(label) {
                const text = String(label || "").trim();
                if (text.startsWith("Anthropic")) {
                    return "Anth";
                }
                if (text.startsWith("Synthetic")) {
                    return "Synth";
                }
                if (text.startsWith("Copilot")) {
                    return "Cop";
                }
                if (text.startsWith("Antigravity")) {
                    return "Anti";
                }
                if (text.startsWith("MiniMax")) {
                    return "Mini";
                }
                if (text.startsWith("Gemini")) {
                    return "Gem";
                }
                if (text.startsWith("Z.ai")) {
                    return "Zai";
                }
                if (text.startsWith("Codex -")) {
                    return text.replace("Codex -", "").trim().slice(0, 5) || "Codex";
                }
                return text.slice(0, 5) || "Prov";
            }

            function normalizeView(value) {
                return VIEW_ORDER.includes(value) ? value : "standard";
            }

            function normalizeTheme(value) {
                const normalized = String(value || "").trim().toLowerCase();
                return THEME_MODES.includes(normalized) ? normalized : "system";
            }

            function nextView(current) {
                const index = VIEW_ORDER.indexOf(normalizeView(current));
                return VIEW_ORDER[(index + 1) % VIEW_ORDER.length];
            }

            function viewCode(view) {
                if (view === "minimal") {
                    return "Minimal";
                }
                if (view === "detailed") {
                    return "Detail";
                }
                return "Default";
            }

            function clampPercent(value) {
                const numeric = Number(value || 0);
                if (Number.isNaN(numeric)) {
                    return 0;
                }
                return Math.max(0, Math.min(100, numeric));
            }

            // updateAgeLabels refreshes every provider age label from its
            // recorded timestamp without rebuilding the DOM, so a long-lived
            // popover (or one whose daemon is unreachable) keeps counting up
            // without a repaint.
            function updateAgeLabels() {
                // Staleness is re-evaluated locally on every tick from the
                // recorded capture time and stale_after_seconds. That is what
                // turns a card stale while the daemon is unreachable, when no
                // new snapshot can arrive. If any card crossed the threshold,
                // re-render once so the dot ring and stale tooltips match; the
                // numbers themselves never change here.
                let staleChanged = false;
                document.querySelectorAll(".provider-status[data-updated-at]").forEach((el) => {
                    const raw = el.getAttribute("data-updated-at") || "";
                    if (!raw) {
                        return;
                    }
                    const was = el.querySelector(".provider-status-dot.is-stale") !== null;
                    const stale = providerStaleFromAttributes(raw, el.getAttribute("data-stale-after"));
                    if (was !== stale) {
                        staleChanged = true;
                    }
                });
                if (staleChanged) {
                    render();
                    return;
                }
                document.querySelectorAll(".provider-updated[data-updated-at]").forEach((el) => {
                    const raw = el.getAttribute("data-updated-at") || "";
                    const fallback = el.getAttribute("data-updated-fallback") || "";
                    if (!raw) {
                        return;
                    }
                    const text = ageLabelFromTimestamp(raw, fallback);
                    el.textContent = text;
                    // Keep the stale tooltip's age phrase current while it is
                    // hovered, without rebuilding the DOM.
                    const wrapper = el.closest(".provider-age");
                    const tip = wrapper && wrapper.querySelector(".provider-status-tip");
                    if (tip) {
                        tip.textContent = staleTooltipText(raw, text, wrapper.getAttribute("data-stale-tooltip") || "");
                    }
                });
                // Dot tooltips carry the same age phrase for stale cards.
                document.querySelectorAll(".provider-status-dot.is-stale").forEach((dot) => {
                    const status = dot.closest(".provider-status");
                    if (!status) {
                        return;
                    }
                    const tip = status.querySelector(".provider-status-tip");
                    if (!tip) {
                        return;
                    }
                    const existing = tip.textContent || "";
                    if (!/^(Last updated |no update in )/.test(existing)) {
                        // Attention wording wins; do not overwrite it.
                        return;
                    }
                    const raw = status.getAttribute("data-updated-at") || "";
                    tip.textContent = staleTooltipText(raw, ageLabelFromTimestamp(raw, ""), existing);
                });
                if (state.snapshot) {
                    headerUpdated.textContent = ageLabelFromTimestamp(
                        state.snapshot.latest_at,
                        state.snapshot.updated_ago
                    );
                }
            }

            // providerStaleFromAttributes is the DOM-only staleness check used
            // by the ticker (matches providerStaleNow without a card object).
            function providerStaleFromAttributes(raw, staleAfter) {
                const after = Number(staleAfter || 0);
                if (!(after > 0) || !raw) {
                    return false;
                }
                const then = Date.parse(raw);
                if (!Number.isFinite(then) || then <= 0) {
                    return false;
                }
                return (Date.now() - then) / 1000 > after;
            }

            // staleTooltipText refreshes the age inside an existing stale
            // tooltip while keeping its original reason suffix.
            function staleTooltipText(raw, currentLabel, existing) {
                const suffixMatch = String(existing || "").match(/ - (.+)$/);
                if (!suffixMatch) {
                    // Generic reason ("no update in 14m"): rebuild from the age.
                    const age = currentLabel === "now" ? "0m" : currentLabel;
                    return "no update in " + age;
                }
                const ageText = currentLabel === "now" ? "just now" : currentLabel + " ago";
                return "Last updated " + ageText + " - " + suffixMatch[1];
            }

            function resetRefreshTimer() {
                if (refreshTimer) {
                    window.clearInterval(refreshTimer);
                }
                refreshTimer = window.setInterval(() => {
                    void loadSnapshot();
                }, Math.max(Number(state.preferences.refresh_seconds) || 60, 10) * 1000);
                // Age labels are computed from client wall-clock time, so they
                // must be refreshed between fetches: that is what lets them keep
                // counting up when the daemon is unreachable and the fetch above
                // fails. Update the text in place (no re-render, no flash) and
                // make no API calls.
                if (ageTickTimer) {
                    window.clearInterval(ageTickTimer);
                }
                ageTickTimer = window.setInterval(updateAgeLabels, 30000);
            }

            // Promo countdown: update tags every 30s without API calls
            let _menubarPromos = [];
            let _promoCountdownTimer = null;

            function storeMenubarPromos(providers) {
                _menubarPromos = (providers || []).filter(p => p.promo).map(p => p.promo);
                if (_promoCountdownTimer) clearInterval(_promoCountdownTimer);
                if (_menubarPromos.length > 0) {
                    _promoCountdownTimer = setInterval(refreshMenubarPromoTags, 30000);
                }
            }

            function refreshMenubarPromoTags() {
                document.querySelectorAll(".promo-tag").forEach(el => {
                    // Find parent provider card to get promo data
                    const promo = _menubarPromos[0]; // Currently only Anthropic has promo
                    if (!promo) return;
                    const offpeak = isPromoOffPeak(promo);
                    el.className = "promo-tag " + (offpeak ? "promo-offpeak" : "promo-peak");
                    el.textContent = promoLabel(promo);
                });
            }

            function isPromoOffPeak(promo) {
                const now = new Date();
                const etStr = now.toLocaleString("en-US", { timeZone: "America/New_York" });
                const et = new Date(etStr);
                const hour = et.getHours();
                const day = et.getDay();
                const isWeekday = day >= 1 && day <= 5;
                const isPeak = promo.peak_weekdays_only ? (isWeekday && hour >= promo.peak_start_hour_et && hour < promo.peak_end_hour_et) : false;
                return !isPeak;
            }

            function promoMinutesUntilTransition(promo) {
                const now = new Date();
                const etStr = now.toLocaleString("en-US", { timeZone: "America/New_York" });
                const et = new Date(etStr);
                const hour = et.getHours();
                const min = et.getMinutes();
                const day = et.getDay();
                const isWeekday = day >= 1 && day <= 5;
                const isPeak = promo.peak_weekdays_only ? (isWeekday && hour >= promo.peak_start_hour_et && hour < promo.peak_end_hour_et) : false;
                let totalMin;
                if (isPeak) {
                    totalMin = (promo.peak_end_hour_et - hour - 1) * 60 + (60 - min);
                } else if (isWeekday && hour < promo.peak_start_hour_et) {
                    totalMin = (promo.peak_start_hour_et - hour - 1) * 60 + (60 - min);
                } else {
                    let daysToAdd;
                    if (day === 5) daysToAdd = 3;
                    else if (day === 6) daysToAdd = 2;
                    else if (day === 0) daysToAdd = 1;
                    else daysToAdd = 1;
                    totalMin = (daysToAdd - 1) * 1440 + (24 - hour - 1) * 60 + (60 - min) + promo.peak_start_hour_et * 60;
                }
                if (promo.ends_at) {
                    const promoEndMin = Math.floor((new Date(promo.ends_at) - now) / 60000);
                    if (promoEndMin > 0 && promoEndMin < totalMin) totalMin = promoEndMin;
                }
                return Math.max(0, totalMin);
            }

            function formatPromoCountdown(minutes) {
                if (minutes <= 0) return "";
                if (minutes >= 1440) {
                    const d = Math.floor(minutes / 1440);
                    const h = Math.floor((minutes % 1440) / 60);
                    return h > 0 ? d + "d " + h + "h" : d + "d";
                }
                if (minutes >= 60) {
                    const h = Math.floor(minutes / 60);
                    const m = minutes % 60;
                    return m > 0 ? h + "h " + m + "m" : h + "h";
                }
                return minutes + "m";
            }

            function promoLabel(promo) {
                const label = isPromoOffPeak(promo) ? "Off-peak" : "Peak hours";
                const countdown = formatPromoCountdown(promoMinutesUntilTransition(promo));
                return countdown ? label + " till " + countdown : label;
            }

            function escapeHTML(value) {
                return String(value == null ? "" : value)
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll("\"", "&quot;")
                    .replaceAll("'", "&#39;");
            }

            // Start last, after every top-level binding in this IIFE has been
            // evaluated. init() renders before it fetches, and render() and the
            // snapshot-restore path touch bindings declared further down (for
            // example the snapshot generation counters). Calling it earlier
            // threw a temporal-dead-zone ReferenceError and left the popover
            // stuck on "Loading".
            init();
        })();
    </script>
</body>
</html>
