<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onWatch Menubar</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="__ONWATCH_BASE_PATH__/static/mistral-recovery.css?v=__ONWATCH_MISTRAL_ASSET_VERSION__">
    <style>
        :root {
            color-scheme: dark;
            --space-xs: 4px;
            --space-sm: 6px;
            --space-md: 8px;
            --space-lg: 12px;

            --font-xs: 9px;
            --font-sm: 10px;
            --font-md: 11px;
            --font-lg: 12px;
            --font-xl: 13px;

            --chart-stroke: 4px;

            --bg-body: #0d0d0d;
            --bg-panel: rgba(16, 16, 16, 0.96);
            --bg-card: rgba(22, 22, 22, 0.96);
            --bg-card-strong: rgba(28, 28, 28, 0.98);
            --bg-hover: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.06);
            --settings-accent: rgba(96, 165, 250, 0.08);
            --settings-gradient-start: rgba(16, 16, 16, 0.99);
            --settings-gradient-end: rgba(10, 10, 10, 0.99);
            --icon-surface: rgba(255, 255, 255, 0.03);
            --scrollbar-thumb-soft: rgba(255, 255, 255, 0.15);
            --scrollbar-thumb-soft-hover: rgba(255, 255, 255, 0.25);
            --scrollbar-thumb: rgba(255, 255, 255, 0.22);
            --scrollbar-thumb-hover: rgba(255, 255, 255, 0.32);
            --footer-divider: rgba(255, 255, 255, 0.18);
            --footer-refresh-hover-bg: rgba(255, 255, 255, 0.08);
            --footer-refresh-hover-border: rgba(255, 255, 255, 0.12);

            --text-primary: #ffffff;
            --text-soft: rgba(255, 255, 255, 0.78);
            --text-muted: rgba(255, 255, 255, 0.5);
            /* Near-white secondary for dense metadata (reset/usage lines):
               ~80% opacity clears WCAG AA 4.5:1 on the dark card. */
            --text-secondary: rgba(255, 255, 255, 0.82);

            --healthy: #22c55e;
            --warning: #f59e0b;
            --critical: #ef4444;
            --track: rgba(255, 255, 255, 0.08);
            --focus: rgba(96, 165, 250, 0.42);
            /* "Needs action" dot: a saturated amber, deliberately brighter and
               more orange than --warning so a paused/reconnect card reads as a
               call to action, not just high usage. */
            --attention: #fbbf24;
            --attention-halo: rgba(251, 191, 36, 0.22);
            /* Stale (older than the provider cadence): amber label, hollow dot.
               Deliberately distinct from --attention so a stale-only card does
               not read as needing a user action. */
            --stale: #fbbf24;
        }

        :root[data-theme="light"] {
            color-scheme: light;
            --bg-body: #f3f5f8;
            --bg-panel: rgba(255, 255, 255, 0.94);
            --bg-card: rgba(248, 250, 252, 0.95);
            --bg-card-strong: rgba(255, 255, 255, 0.98);
            --bg-hover: rgba(15, 23, 42, 0.06);
            --border: rgba(15, 23, 42, 0.12);
            --settings-accent: rgba(37, 99, 235, 0.1);
            --settings-gradient-start: rgba(255, 255, 255, 0.99);
            --settings-gradient-end: rgba(241, 245, 249, 0.97);
            --icon-surface: rgba(15, 23, 42, 0.05);
            --scrollbar-thumb-soft: rgba(15, 23, 42, 0.22);
            --scrollbar-thumb-soft-hover: rgba(15, 23, 42, 0.34);
            --scrollbar-thumb: rgba(15, 23, 42, 0.3);
            --scrollbar-thumb-hover: rgba(15, 23, 42, 0.42);
            --footer-divider: rgba(15, 23, 42, 0.26);
            --footer-refresh-hover-bg: rgba(15, 23, 42, 0.1);
            --footer-refresh-hover-border: rgba(15, 23, 42, 0.2);
            --text-primary: #0f172a;
            --text-soft: rgba(15, 23, 42, 0.82);
            --text-muted: rgba(15, 23, 42, 0.62);
            /* Darker secondary for dense metadata on the light card. */
            --text-secondary: rgba(15, 23, 42, 0.78);
            --track: rgba(15, 23, 42, 0.12);
            --focus: rgba(37, 99, 235, 0.45);
            /* Darker amber on the light card so the dot keeps contrast. */
            --attention: #d97706;
            --attention-halo: rgba(217, 119, 6, 0.2);
            --stale: #b45309;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-body);
            color: var(--text-primary);
            font-family: "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
            font-size: var(--font-md);
            line-height: 1.25;
            overflow: hidden;
        }

        a,
        button,
        input,
        select {
            font: inherit;
        }

        button {
            border: 0;
            background: none;
            color: inherit;
            cursor: pointer;
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }

        .hidden {
            display: none !important;
        }

        .menubar-shell {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            min-height: 0;
            max-height: 100%;
            gap: 4px;
            padding: 0 0 5px;
            background: var(--bg-body);
            overflow: hidden;
        }

        .menubar-shell.settings-open {
            min-height: 0;
        }

        .menubar-header,
        .menubar-footer,
        .provider-card,
        .minimal-provider-row,
        .state-card,
        .settings-panel {
            border: 1px solid var(--border);
            background: var(--bg-panel);
        }

        .menubar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            min-height: 30px;
            padding: 0 6px;
            border-radius: 0;
            border-top: 0;
            border-left: 0;
            border-right: 0;
        }

        .header-cluster,
        .header-meta,
        .header-actions {
            display: flex;
            align-items: center;
        }

        .header-cluster {
            gap: var(--space-sm);
            min-width: 0;
            cursor: pointer;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 18px;
            height: 18px;
            color: var(--text-primary);
        }

        .brand-mark svg {
            width: 18px;
            height: 18px;
        }

        .header-value {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1;
            white-space: nowrap;
        }

        .header-value.hidden {
            display: none;
        }

        .header-meta {
            gap: var(--space-xs);
            color: var(--text-muted);
            font-size: var(--font-xs);
            letter-spacing: 0.04em;
            text-transform: none;
            white-space: nowrap;
        }

        .meta-divider {
            width: 2px;
            height: 2px;
            border-radius: 999px;
            background: currentColor;
            opacity: 0.8;
        }

        .header-actions {
            gap: 2px;
            flex-shrink: 0;
        }

        .icon-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 24px;
            height: 22px;
            padding: 0 5px;
            border-radius: 999px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-soft);
            transition: background-color 180ms ease, border-color 180ms ease;
        }

        /* Hosted inside an editor webview (VS Code sidebar, Simple Browser): the
           host owns the surface, so the popover close button has no job. */
        body.embedded #close-button {
            display: none;
        }

        .icon-button:hover {
            background: var(--bg-hover);
            border-color: var(--border);
        }

        .icon-button svg {
            width: 13px;
            height: 13px;
        }

        #view-toggle {
            min-width: 64px;
            padding: 0 6px;
        }

        .view-pill {
            font-size: var(--font-sm);
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: none;
            white-space: nowrap;
        }

        .menubar-body {
            flex: 1 1 auto;
            min-height: 0;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb-soft) transparent;
        }

        .menubar-body::-webkit-scrollbar {
            width: 6px;
        }

        .menubar-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .menubar-body::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb-soft);
            border-radius: 3px;
        }

        .menubar-body::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-soft-hover);
        }

        .provider-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-sm);
            min-width: 0;
            padding-bottom: 1px;
        }

        .provider-copy {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .provider-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            color: var(--healthy);
            background-color: currentColor;
            -webkit-mask-position: center;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-size: 16px 16px;
            mask-position: center;
            mask-repeat: no-repeat;
            mask-size: 16px 16px;
        }

        .provider-icon img,
        .provider-icon svg {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        .provider-icon-anthropic {
            -webkit-mask-image: url("/static/icons/anthropic.svg");
            mask-image: url("/static/icons/anthropic.svg");
        }

        .provider-icon-codex,
        .provider-icon-openai {
            -webkit-mask-image: url("/static/icons/openai.svg");
            mask-image: url("/static/icons/openai.svg");
        }

        .provider-icon-minimax {
            -webkit-mask-image: url("/static/icons/minimax.svg");
            mask-image: url("/static/icons/minimax.svg");
        }

        .provider-icon-copilot {
            -webkit-mask-image: url("/static/icons/copilot.svg");
            mask-image: url("/static/icons/copilot.svg");
        }

        .provider-icon-antigravity {
            -webkit-mask-image: url("/static/icons/antigravity.svg");
            mask-image: url("/static/icons/antigravity.svg");
        }

        .provider-icon-gemini {
            -webkit-mask-image: url("/static/icons/gemini.svg");
            mask-image: url("/static/icons/gemini.svg");
        }

        .provider-icon-zai {
            -webkit-mask-image: url("/static/icons/zai.svg");
            mask-image: url("/static/icons/zai.svg");
        }

        .provider-icon-synthetic {
            -webkit-mask-image: url("/static/icons/synthetic.svg");
            mask-image: url("/static/icons/synthetic.svg");
        }

        .provider-icon-grok {
            -webkit-mask-image: url("/static/icons/grok.svg");
            mask-image: url("/static/icons/grok.svg");
        }

        .provider-icon-kimi {
            -webkit-mask-image: url("/static/icons/kimi.svg");
            mask-image: url("/static/icons/kimi.svg");
        }

        .provider-icon-mistral {
 -webkit-mask-image: url("/static/icons/mistral.svg");
 mask-image: url("/static/icons/mistral.svg");
 }
        .provider-icon-opencode {
            -webkit-mask-image: url("/static/icons/opencode.svg");
            mask-image: url("/static/icons/opencode.svg");
        }

        .provider-icon-ollama {
            -webkit-mask-image: url("/static/icons/ollama.svg");
            mask-image: url("/static/icons/ollama.svg");
        }

        .provider-icon-muse {
            -webkit-mask-image: url("/static/icons/muse.svg");
            mask-image: url("/static/icons/muse.svg");
        }

        .provider-icon-commandcode {
            -webkit-mask-image: url("/static/icons/commandcode.svg");
            mask-image: url("/static/icons/commandcode.svg");
        }

        .provider-icon-moonshot {
            -webkit-mask-image: url("/static/icons/moonshot.svg");
            mask-image: url("/static/icons/moonshot.svg");
        }

        .provider-icon-deepseek {
            -webkit-mask-image: url("/static/icons/deepseek.svg");
            mask-image: url("/static/icons/deepseek.svg");
        }

        .status-warning .provider-icon {
            color: var(--warning);
        }

        .status-critical .provider-icon,
        .status-danger .provider-icon {
            color: var(--critical);
        }

        .provider-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: var(--font-xl);
            font-weight: 650;
            letter-spacing: -0.01em;
        }

        .promo-tag {
            display: inline-flex;
            align-items: center;
            padding: 1px 6px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.02em;
            margin-left: 4px;
            text-decoration: none;
            cursor: pointer;
            flex-shrink: 0;
        }

        .promo-tag.promo-offpeak {
            background: transparent;
            color: var(--text-muted);
            padding: 0 4px;
        }

        .promo-tag.promo-offpeak:hover {
            color: var(--text-primary);
        }

        .promo-tag.promo-peak {
            background: rgba(239, 68, 68, 0.15);
            color: #EF4444;
        }

        .promo-tag.promo-peak:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .provider-updated {
            flex-shrink: 0;
            color: var(--text-muted);
            font-size: var(--font-xs);
            white-space: nowrap;
        }

        /* Default-view header meta: freshness label plus a status dot. The dot
           carries the status; there is no inline status text. */
        .provider-meta {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .provider-status-dot {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: var(--healthy);
            flex-shrink: 0;
        }

        .provider-status-dot.status-warning {
            background: var(--warning);
        }

        .provider-status-dot.status-critical,
        .provider-status-dot.status-danger {
            background: var(--critical);
        }

        /* Attention state: the card needs a user action (re-auth, reconnect,
           browser access). It deliberately does NOT touch background, so the
           severity classes keep owning the fill: a paused account at 100%
           still reads red. Attention is a separate amber ring plus a soft
           halo around the dot, visible on both card surfaces. */
        .provider-status-dot.status-attention {
            box-shadow:
                0 0 0 1.5px var(--attention),
                0 0 0 3.5px var(--attention-halo);
        }

        /* Stale data: the age label turns amber and the severity dot becomes a
           hollow ring (severity color stays the ring, fill is transparent).
           The card keeps its numbers; staleness never changes severity. On an
           attention card both treatments show: attention keeps its halo and
           the stale ring sits inside it. */
        .provider-updated.is-stale {
            color: var(--stale);
            font-weight: 600;
            cursor: default;
        }

        /* Wrapper that carries the stale age tooltip; positioned so the tip
           anchors to the label, not to the card. */
        .provider-age {
            position: relative;
            display: inline-flex;
            align-items: center;
            border-radius: 6px;
        }

        .provider-age:focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }

        .provider-age:hover .provider-status-tip,
        .provider-age:focus-within .provider-status-tip,
        .provider-age:focus .provider-status-tip {
            display: block;
        }

        .provider-age.tip-above .provider-status-tip {
            top: auto;
            bottom: calc(100% + 6px);
        }

        .provider-status-dot.is-stale {
            background: transparent;
            box-shadow: inset 0 0 0 1.5px var(--healthy);
        }

        .provider-status-dot.status-warning.is-stale {
            box-shadow: inset 0 0 0 1.5px var(--warning);
        }

        .provider-status-dot.status-critical.is-stale,
        .provider-status-dot.status-danger.is-stale {
            box-shadow: inset 0 0 0 1.5px var(--critical);
        }

        /* Both states at once: the hollow severity ring stays the inner ring,
           and the attention halo sits outside it. */
        .provider-status-dot.status-attention.is-stale {
            box-shadow:
                inset 0 0 0 1.5px var(--healthy),
                0 0 0 1.5px var(--attention),
                0 0 0 3.5px var(--attention-halo);
        }

        .provider-status-dot.status-warning.status-attention.is-stale {
            box-shadow:
                inset 0 0 0 1.5px var(--warning),
                0 0 0 1.5px var(--attention),
                0 0 0 3.5px var(--attention-halo);
        }

        .provider-status-dot.status-critical.status-attention.is-stale,
        .provider-status-dot.status-danger.status-attention.is-stale {
            box-shadow:
                inset 0 0 0 1.5px var(--critical),
                0 0 0 1.5px var(--attention),
                0 0 0 3.5px var(--attention-halo);
        }

        /* Hover/focus tooltip for the dot. Native title tooltips are unreliable
           inside the non-activating macOS WKWebView panel, so the reason and
           the action are rendered here. */
        .provider-status {
            position: relative;
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
        }

        .provider-status:focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }

        .provider-status-tip {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            z-index: 40;
            max-width: 220px;
            width: max-content;
            padding: 5px 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card-strong);
            color: var(--text-primary);
            font-size: var(--font-xs);
            font-weight: 500;
            line-height: 1.3;
            letter-spacing: 0;
            text-align: left;
            white-space: normal;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.32);
            pointer-events: none;
        }

        /* display, not opacity: a hidden absolutely positioned tip still
           contributes scrollable overflow, which would add phantom scroll space
           to the popover body. */
        .provider-status:hover .provider-status-tip,
        .provider-status:focus-within .provider-status-tip,
        .provider-status:focus .provider-status-tip {
            display: block;
        }

        /* The scrollable body clips a tip that hangs past its bottom edge, so a
           card near the bottom flips its tip above the dot. */
        .provider-status.tip-above .provider-status-tip {
            top: auto;
            bottom: calc(100% + 6px);
        }

        :root[data-theme="light"] .provider-status-tip {
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.16);
        }

        .mistral-recovery {
            gap: var(--space-sm);
            margin: var(--space-sm) 0;
            font-size: var(--font-sm);
            line-height: 1.3;
        }

        .mistral-retry {
            padding: 4px 8px;
            border-radius: 6px;
        }

        .minimal-view {
            display: grid;
            gap: var(--space-xs);
            padding: 1px;
            align-content: start;
        }

        .minimal-provider-row {
            display: grid;
            gap: 2px;
            padding: 6px 8px;
            border-radius: 13px;
        }

        .minimal-quota-list {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0;
            color: var(--text-soft);
            font-size: var(--font-sm);
        }

        .minimal-quota-inline {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            min-width: 0;
            white-space: nowrap;
        }

        .minimal-quota-label {
            color: var(--text-primary);
            font-weight: 500;
        }

        .minimal-quota-percent {
            color: var(--text-primary);
            font-weight: 700;
        }

        .minimal-quota-reset {
            color: var(--text-muted);
        }

        .inline-divider {
            color: var(--text-muted);
            padding: 0 var(--space-sm);
        }

        .provider-grid {
            gap: 5px;
            padding: 1px;
            align-content: start;
        }

        /* Default view packs cards into explicit rows (computed in JS): each row
           is a flex line whose cards grow in proportion to their column span, so
           a row never leaves empty space on the right. */
        .provider-grid-standard {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .provider-row {
            display: flex;
            align-items: stretch;
            gap: 5px;
            min-width: 0;
        }

        .provider-grid-detailed {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
        }

        .provider-card {
            display: grid;
            gap: 3px;
            padding: 6px 8px;
            border-radius: 14px;
        }

        .provider-card-standard {
            /* --card-span is min(quotaCount, 4); grow keeps row proportions. */
            flex: var(--card-span, 4) 1 0;
            min-width: 0;
            gap: 2px;
            padding: 4px 6px;
            border-radius: 12px;
        }

        .provider-card-detailed {
            grid-column: 1 / -1;
            gap: 2px;
        }

        .quota-grid {
            display: grid;
            /* --quota-cols is ringColumns(count): never orphans a lone ring. */
            grid-template-columns: repeat(var(--quota-cols, 1), minmax(0, 1fr));
            gap: 2px;
            min-width: 0;
        }

        /* Default-view density: big ring tiles, tighter chrome than the detailed
           view. --ring-size is set per card in JS so a four-quota card keeps its
           rings from crowding the label at 360px. */
        .menubar-view-standard {
            --chart-stroke: 4px;
            --ring-size: 58px;
        }

        .menubar-view-standard .provider-header {
            padding-bottom: 0;
        }

        .menubar-view-standard .provider-icon {
            width: 14px;
            height: 14px;
            -webkit-mask-size: 14px 14px;
            mask-size: 14px 14px;
        }

        .menubar-view-standard .provider-name {
            font-size: 11px;
        }

        .menubar-view-standard .provider-copy {
            gap: 5px;
        }

        .supplementary-section {
            margin-top: 6px;
            padding: 6px 8px;
            border-radius: 6px;
            background: var(--surface-variant, rgba(128,128,128,0.06));
            border: 1px solid var(--border-subtle, rgba(128,128,128,0.1));
        }
        .supplementary-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .supplementary-title {
            font-weight: 600;
            opacity: 0.5;
        }
        .supplementary-hint {
            font-style: italic;
            text-transform: none;
            letter-spacing: 0;
            opacity: 0.4;
        }
        .supplementary-grid {
            opacity: 0.75;
        }

        /* Inline API source badge for quota items */
        .quota-source-tag {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 1px 5px;
            border-radius: 4px;
            background: var(--surface-variant, rgba(128,128,128,0.1));
            color: var(--text-muted, rgba(128,128,128,0.6));
            opacity: 0.7;

            font-weight: 400;
            font-style: italic;
            text-transform: none;
            letter-spacing: 0;

        /* Default-view ring tile: the ring carries the percent and the reset
           countdown, and the full label wraps underneath. No inner box - tiles
           sit directly on the provider card. */
        .quota-tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-width: 0;
            color: var(--healthy);

            color: var(--warning);

        .quota-tile.status-critical,
        .quota-tile.status-danger {
            color: var(--critical);

        .quota-ring {
            position: relative;
            display: grid;
            place-items: center;
            width: var(--ring-size, 58px);
            height: var(--ring-size, 58px);
            max-width: 100%;
            flex-shrink: 0;
        }

        .quota-meter {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .quota-track {
            fill: none;
            stroke: var(--track);
            stroke-width: var(--chart-stroke);
        }

        .quota-fill {
            fill: none;
            stroke: currentColor;
            stroke-width: var(--chart-stroke);
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 20px 20px;
        }

        .quota-ring-center {
            position: relative;
            display: grid;
            place-items: center;
            text-align: center;
            line-height: 1;
            color: currentColor;

            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            font-variant-numeric: tabular-nums;
        }

        /* Three digits would touch the ring stroke at the default size. */
        .quota-ring-pct.is-wide {
            font-size: calc(var(--ring-size, 58px) * 0.225);
        }

        .quota-ring-pct.is-wide .quota-ring-unit {
            font-size: calc(var(--ring-size, 58px) * 0.13);
        }

        .quota-ring-unit {
            font-size: calc(var(--ring-size, 58px) * 0.155);
            font-weight: 700;
            opacity: 0.72;
            margin-left: 0.5px;

        .quota-ring-reset {
            margin-top: calc(var(--ring-size, 58px) * 0.03);

            font-weight: 550;

        .settings-option em {

        .settings-divider {

        .settings-check-copy {
            display: grid;
            gap: 1px;

        .settings-check-copy strong {

                const list = settingsBody.querySelector("#provider-order-list");
                const dragging = list ? list.querySelector(".provider-order-item.dragging") : null;
                const item = event.target instanceof Element ? event.target.closest(".provider-order-item") : null;
                if (!(list instanceof HTMLElement) || !(dragging instanceof HTMLElement) || !(item instanceof HTMLElement) || item === dragging) {
                    return;
                }
                event.preventDefault();
                const box = item.getBoundingClientRect();
                const insertBefore = event.clientY < box.top + box.height / 2;
                if (insertBefore) {
                    list.insertBefore(dragging, item);
                } else {
                    list.insertBefore(dragging, item.nextSibling);
                }
            }

            function handleSettingsDrop(event) {
                if (!state.settingsOpen || !state.draft) {
                    return;
                }
                const list = settingsBody.querySelector("#provider-order-list");
                if (!(list instanceof HTMLElement)) {
                    return;
                }
                event.preventDefault();
                syncDraftProviderOrder(list);
            }

            function handleSettingsDragEnd(event) {
                if (!state.settingsOpen || !state.draft) {
                    return;
                }
                const item = event.target instanceof Element ? event.target.closest(".provider-order-item") : null;
                if (item instanceof HTMLElement) {
                    item.classList.remove("dragging");
                }
                const list = settingsBody.querySelector("#provider-order-list");
                if (list instanceof HTMLElement) {
                    syncDraftProviderOrder(list);
                }
                state.draggingProviderID = "";
            }

            function syncDraftProviderOrder(list) {
                state.draft.providers_order = [...list.querySelectorAll(".provider-order-item[data-provider-id]")]
                    .map((item) => item.getAttribute("data-provider-id") || "")
                    .filter(Boolean);
                scheduleAutoSave();
                renderBody();
                queueResizeReport();
            }

            function moveDraftProvider(providerID, direction) {
                if (!state.settingsOpen || !state.draft || !providerID) {
                    return;
                }
                const available = orderedProviderOptions().map((provider) => provider.id);
                const order = mergeProviderOrder(state.draft.providers_order, available);
                const from = order.indexOf(providerID);
                if (from < 0) {
                    return;
                }
                const delta = direction === "up" ? -1 : 1;
                const to = from + delta;
                if (to < 0 || to >= order.length) {
                    return;
                }
                [order[from], order[to]] = [order[to], order[from]];
                state.draft.providers_order = order;
                scheduleAutoSave();
                renderBody();
                renderSettings();
                queueResizeReport();
            }

            function render() {
                shell.className = `menubar-shell menubar-view-${escapeHTML(state.view)}${state.settingsOpen ? " settings-open" : ""}`;
                updateHeader();
                renderBody();
                renderSettings();
                settingsPanel.classList.toggle("hidden", !state.settingsOpen);
                settingsPanel.setAttribute("aria-hidden", String(!state.settingsOpen));
                viewPill.textContent = viewCode(state.view);
                queueResizeReport();
            }

            function updateHeader() {
                const providers = visibleProviders();
                headerValue.textContent = "onWatch";
                headerValue.classList.remove("hidden");
                headerValue.setAttribute("aria-hidden", "false");
                headerCount.textContent = `${providers.length} ${providers.length === 1 ? "provider" : "providers"}`;
                // Header age tracks the newest provider data (latest_at), not
                // the snapshot build time, so it keeps growing when every
                // provider has stopped polling.
                headerUpdated.textContent = ageLabelFromTimestamp(
                    state.snapshot && state.snapshot.latest_at,
                    state.snapshot && state.snapshot.updated_ago
                );
            }

            function renderBody() {
                if (state.loading && !state.snapshot) {
                    body.innerHTML = renderStateCard("Loading", "Fetching quota snapshot");
                    return;
                }
                if (state.error && !state.snapshot) {
                    body.innerHTML = renderStateCard("Unavailable", state.error);
                    return;
                }
                if (!state.snapshot || !Array.isArray(state.snapshot.providers) || state.snapshot.providers.length === 0) {
                    body.innerHTML = renderStateCard("No Data", "Enable a provider to fill the tray.");
                    return;
                }
                const providers = visibleProviders();
                storeMenubarPromos(providers);
                if (providers.length === 0) {
                    body.innerHTML = renderStateCard("No Data", "Choose at least one provider.");
                    return;
                }
                if (state.view === "minimal") {
                    body.innerHTML = renderMinimalView(providers);
                    return;
                }
                if (state.view === "detailed") {
                    body.innerHTML = renderDetailedView(providers);
                    return;
                }
                body.innerHTML = renderStandardView(providers);
            }

            function renderSettings() {
                if (!state.settingsOpen || !state.draft) {
                    settingsBody.innerHTML = "";
                    document.getElementById("settings-save").disabled = false;
                    return;
                }
                ensureMultiProviderSelection();
                const draft = state.draft;
                const orderedOptions = orderedProviderOptions();
                const showAll = draft.visible_providers.length === 0;
                const statusOptions = selectableStatusQuotaOptions();
                const selectedKeys = new Set(draft.status_display.selected_quotas.map((selection) => statusSelectionKey(selection)));
                const selectedCount = draft.status_display.selected_quotas.length;
                settingsBody.innerHTML = `
                    <section class="settings-section">
                        <h2>Appearance</h2>
                        <div class="settings-card">
                            <label class="settings-row">
                                <span>Density</span>
                                <select name="view-mode" aria-label="Menubar density">
                                    <option value="minimal" ${draft.default_view === "minimal" ? "selected" : ""}>Minimal</option>
                                    <option value="standard" ${draft.default_view === "standard" ? "selected" : ""}>Default</option>
                                    <option value="detailed" ${draft.default_view === "detailed" ? "selected" : ""}>Detail</option>
                                </select>
                            </label>
                            <div class="settings-hint">Minimal keeps a compact dashboard-style summary. Default shows quota cards. Detail expands bars and metadata.</div>
                            <div class="settings-divider" aria-hidden="true"></div>
                            <label class="settings-row">
                                <span>Theme</span>
                                <select name="theme-mode" aria-label="Theme mode">
                                    <option value="system" ${draft.theme === "system" ? "selected" : ""}>System</option>
                                    <option value="light" ${draft.theme === "light" ? "selected" : ""}>Light</option>
                                    <option value="dark" ${draft.theme === "dark" ? "selected" : ""}>Dark</option>
                                </select>
                            </label>
                            <div class="settings-hint">System follows macOS appearance. Light and Dark override it.</div>
                        </div>
                    </section>

                    <section class="settings-section">
                        <h2>Status Bar Display</h2>
                        <div class="settings-card">
                            ${statusDisplayOptions.map((option) => `
                                <label class="settings-option">
                                    <input type="radio" name="status-display" value="${escapeHTML(option.mode)}" ${draft.status_display.mode === option.mode ? "checked" : ""}>
                                    <span class="settings-option-copy">
                                        <strong>${escapeHTML(option.label)}</strong>
                                        ${option.detail(state.snapshot, draft) ? `<em>${escapeHTML(option.detail(state.snapshot, draft))}</em>` : ""}
                                    </span>
                                </label>
                            `).join("")}
                            ${draft.status_display.mode === "multi_provider" ? `
                                <div class="settings-divider" aria-hidden="true"></div>
                                <div class="settings-collapsible ${state.quotaSelectionExpanded ? "" : "collapsed"}" id="quota-selection-collapsible">
                                    <button type="button" class="settings-collapsible-toggle" data-action="toggle-quota-selection">
                                        <span>Select quotas (${selectedCount}/3)</span>
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                                    </button>
                                    <div class="settings-collapsible-content">
                                        <div class="settings-hint">Select quotas to display. Hidden providers do not appear here.</div>
                                        <div class="settings-checklist">
                                            ${statusOptions.map((option) => {
                                                const key = statusSelectionKey(option);
                                                const checked = selectedKeys.has(key);
                                                const disabled = !checked && selectedCount >= 3;
                                                return `
                                                    <label class="settings-check-item ${disabled ? "is-disabled" : ""}">
                                                        <input type="checkbox" name="status-selection" value="${escapeHTML(key)}" ${checked ? "checked" : ""} ${disabled ? "disabled" : ""}>
                                                        <span class="settings-check-copy">
                                                            <strong>${escapeHTML(option.provider_label)} - ${escapeHTML(option.quota_label)}</strong>
                                                            <em>${escapeHTML(compactQuotaLabel(option.quota_label, option.quota_key))} · ${escapeHTML(option.base_provider || "provider")}</em>
                                                        </span>
                                                    </label>
                                                `;
                                            }).join("") || '<div class="settings-hint">No visible provider quotas are available yet.</div>'}
                                        </div>
                                    </div>
                                </div>
                                <div class="settings-preview">
                                    <span class="settings-preview-label">Preview</span>
                                    <strong>${escapeHTML(statusDisplayPreview(state.snapshot, draft))}</strong>
                                </div>
                            ` : ""}
                        </div>
                    </section>

                    <section class="settings-section">
                        <h2>Provider Order</h2>
                        <div class="settings-card">
                            <div class="settings-hint">Drag or use arrows to reorder. Toggle visibility on the right.</div>
                            <div class="provider-order-list" id="provider-order-list">
                                ${orderedOptions.map((provider, index) => {
                                    const visible = showAll || draft.visible_providers.includes(provider.id);
                                    const canMoveUp = index > 0;
                                    const canMoveDown = index < orderedOptions.length - 1;
                                    return `
                                        <div class="provider-order-item ${visible ? "" : "is-hidden"}" draggable="true" data-provider-id="${escapeHTML(provider.id)}">
                                            <span class="provider-order-handle" aria-hidden="true">${icons.grip}</span>
                                            <span class="provider-icon ${escapeHTML(providerIconClass(provider))}" aria-hidden="true"></span>
                                            <div class="provider-order-copy">
                                                <span class="provider-order-name">${escapeHTML(provider.label)}</span>
                                                <span class="provider-order-meta">${escapeHTML(provider.base_provider || "provider")}</span>
                                            </div>
                                            <div class="provider-order-controls">
                                                <button type="button" class="provider-order-move" data-provider-move="up" data-provider-id="${escapeHTML(provider.id)}" ${canMoveUp ? "" : "disabled"} aria-label="Move ${escapeHTML(provider.label)} up" title="Move up">${icons.arrowUp}</button>
                                                <button type="button" class="provider-order-move" data-provider-move="down" data-provider-id="${escapeHTML(provider.id)}" ${canMoveDown ? "" : "disabled"} aria-label="Move ${escapeHTML(provider.label)} down" title="Move down">${icons.arrowDown}</button>
                                                <label class="provider-order-toggle">
                                                    <input type="checkbox" name="visible-provider" value="${escapeHTML(provider.id)}" ${visible ? "checked" : ""}>
                                                    <span>${visible ? "show" : "hide"}</span>
                                                </label>
                                            </div>
                                        </div>
                                    `;
                                }).join("")}
                            </div>
                        </div>
                    </section>
                `;
                document.getElementById("settings-save").disabled = state.saving;
                settingsBody.querySelectorAll("button[data-provider-move]").forEach((button) => {
                    button.addEventListener("click", () => {
                        const providerID = button.getAttribute("data-provider-id") || "";
                        const direction = button.getAttribute("data-provider-move") || "";
                        if (!providerID || !direction) {
                            return;
                        }
                        moveDraftProvider(providerID, direction);
                    });
                });
            }

            const STANDARD_COLUMNS = 4;

            // ringColumns keeps rings from orphaning on their own line: 4 fits
            // one row, 5 splits 3+2 and 6 splits 3+3. Never exceeds 4. Above 6
            // (rare) pick the widest column count that leaves no lone ring.
            function ringColumns(count) {
                if (count <= 1) return 1;
                if (count === 2) return 2;
                if (count === 3) return 3;
                if (count === 4) return 4;
                if (count === 5 || count === 6) return 3;
                for (let columns = 4; columns >= 2; columns--) {
                    if (count % columns !== 1) return columns;
                }
                return 4;
            }

            // packStandardRows greedily fills rows in the user's provider order
            // without pulling later cards forward: a card joins the current row
            // only if its span fits in the columns left, otherwise it starts a
            // new row. Every row then stretches to the full width via flex-grow.
            function packStandardRows(providers) {
                const rows = [];
                let row = [];
                let used = 0;
                providers.forEach((provider) => {
                    const span = cardSpan(provider);
                    if (row.length > 0 && used + span > STANDARD_COLUMNS) {
                        rows.push(row);
                        row = [];
                        used = 0;
                    }
                    row.push({ provider, span });
                    used += span;
                });
                if (row.length > 0) {
                    rows.push(row);
                }
                return rows;
            }

            function renderStandardView(providers) {
                const rows = packStandardRows(providers);
                return `
                    <section class="provider-grid provider-grid-standard">
                        ${rows.map((row) => `
                            <div class="provider-row">
                                ${row.map(({ provider, span }) => renderStandardCard(provider, span)).join("")}
                            </div>
                        `).join("")}
                    </section>
                `;
            }

            function renderMinimalView(providers) {
                return `
                    <section class="minimal-view">
                        ${providers.map((provider) => `
                            <article class="minimal-provider-row status-${escapeHTML(provider.status || "healthy")}">
                                ${providerHeaderMarkup(provider)}
                                <div class="minimal-quota-list">
                                    ${providerQuotas(provider).map((quota, index) => `
                                        ${index > 0 ? '<span class="inline-divider" aria-hidden="true">|</span>' : ""}
                                        <span class="minimal-quota-inline">
                                            <span class="minimal-quota-label">${escapeHTML(compactQuotaLabel(quota.label, quota.key))}</span>
                                            ${sourceTagMarkup(quota)}
                                            <span class="minimal-quota-percent">${Math.round(clampPercent(quota.percent))}%</span>
                                            <span class="minimal-quota-reset">${escapeHTML(compactResetLabel(quota))}</span>
                                        </span>
                                    `).join("")}
                                </div>
                            </article>
                        `).join("")}
                    </section>
                `;
            }

            function renderDetailedView(providers) {
                return `
                    <section class="provider-grid provider-grid-detailed">
                        ${providers.map((provider) => renderDetailedCard(provider)).join("")}
                    </section>
                `;
            }

            function renderStandardCard(provider, span) {
                const quotas = providerQuotas(provider);
                const columns = ringColumns(quotas.length);
                const ringSize = ringSizeForColumns(columns);
                return `
                    <article class="provider-card provider-card-standard status-${escapeHTML(provider.status || "healthy")}" style="--card-span:${span || cardSpan(provider)};">
                        ${standardHeaderMarkup(provider)}
                        <div class="quota-grid" style="--quota-cols:${columns};--ring-size:${ringSize}px;">
                            ${quotas.map((quota) => renderStandardQuota(quota)).join("")}
                        </div>
                    </article>
                `;
            }

            // ringSizeForColumns shrinks the ring when a card packs more quotas,
            // so a four-quota card keeps clear space around every label at 360px.
            function ringSizeForColumns(columns) {
                if (columns >= 4) return 52;
                if (columns === 3) return 56;
                return 58;
            }

            function standardStatusLabel(provider) {
                const status = String(provider && provider.status || "healthy");
                if (status === "critical" || status === "danger") return "Critical";
                if (status === "warning") return "Warning";
                return "Healthy";
            }

            // providerStaleNow re-evaluates staleness against this client's
            // wall clock, so a long-lived popover (or one whose daemon is
            // unreachable) marks a card stale without a new response. The
            // server's flag is authoritative; stale_after_seconds lets the 30s
            // age ticker make the same decision locally.
            function providerStaleNow(provider) {
                if (!provider) {
                    return false;
                }
                if (provider.stale === true) {
                    return true;
                }
                const after = Number(provider.stale_after_seconds || 0);
                if (!(after > 0)) {
                    return false;
                }
                const then = Date.parse(provider.updated_at_time || provider.updatedAtTime || "");
                if (!Number.isFinite(then) || then <= 0) {
                    return false;
                }
                return (Date.now() - then) / 1000 > after;
            }

            // providerStaleTooltip is the hover/focus text for a stale card.
            // A class reason ("network error") is paired with the age; the
            // generic server reason already reads as "no update in 14m".
            function providerStaleTooltip(provider) {
                const reason = String(provider && provider.stale_reason || "").trim();
                if (!reason) {
                    return "no update in " + providerAgeLabel(provider);
                }
                if (reason.indexOf("no update in") === 0) {
                    return reason;
                }
                const age = providerAgeLabel(provider);
                const ageText = age === "now" ? "just now" : age + " ago";
                return "Last updated " + ageText + " - " + reason;
            }

            // providerAttention is the action a card needs from the user, or
            // null when there is nothing to do. Staleness is a separate, age
            // driven state (amber label, hollow dot): it is not an attention
            // state, because old data usually needs no user action. Attention
            // wins the dot tooltip wording when both apply.
            function providerAttention(provider) {
                if (!provider) {
                    return null;
                }
                if (provider.connection && provider.connection.reason === "browser_access_denied") {
                    return "Browser access required - allow access from the menu";
                }
                const connection = String(provider.connection_status || "");
                if (connection === "reconnect") {
                    return "Reconnect required - open the dashboard to reconnect";
                }
                if (connection === "paused") {
                    const base = String(provider.base_provider || provider.id || "").split(":")[0];
                    if (base === "codex") {
                        return "Codex auth failed - run `codex auth`";
                    }
                    const label = String(provider.label || "Provider");
                    return `${label} auth failed - re-authenticate to resume`;
                }
                return null;
            }

            // providerDotTitle is the dot's accessible label and tooltip text:
            // the action the card needs when it has one, otherwise the usage
            // severity the dot has always carried.
            function providerDotTitle(provider) {
                const attention = providerAttention(provider);
                if (attention) {
                    return attention;
                }
                if (providerStaleNow(provider)) {
                    return providerStaleTooltip(provider);
                }
                const peak = Math.round(clampPercent(provider && provider.highest_percent));
                return `${standardStatusLabel(provider)} - peak ${peak}%`;
            }

            // providerStatusMarkup is the right-hand status cluster: the dot
            // plus its hover/focus tooltip. The tooltip is a custom element
            // because native title tooltips do not show reliably inside the
            // non-activating macOS WKWebView panel. The dot keeps an
            // aria-label so the reason is announced without the tooltip.
            function providerStatusMarkup(provider) {
                const status = String(provider && provider.status || "healthy");
                const dotTitle = providerDotTitle(provider);
                const attention = providerAttention(provider);
                const attentionClass = attention ? " status-attention" : "";
                const stale = providerStaleNow(provider);
                const staleClass = stale ? " is-stale" : "";
                // The ticker re-evaluates from these attributes: updated time,
                // cadence, and both candidate tooltip texts, so a card can go
                // stale while the daemon is unreachable without a re-render.
                const severityTitle = `${standardStatusLabel(provider)} - peak ${Math.round(clampPercent(provider.highest_percent))}%`;
                return `
                    <span class="provider-status" tabindex="0" role="img" aria-label="${escapeHTML(dotTitle)}" data-updated-at="${escapeHTML(provider.updated_at_time || '')}" data-stale-after="${escapeHTML(String(provider.stale_after_seconds || 0))}" data-attention-title="${escapeHTML(attention || '')}" data-severity-title="${escapeHTML(severityTitle)}">
                        <span class="provider-status-dot status-${escapeHTML(status)}${attentionClass}${staleClass}"></span>
                        <span class="provider-status-tip" role="tooltip" aria-hidden="true">${escapeHTML(dotTitle)}</span>
                    </span>
                `;
            }

            // positionStatusTip flips a tip that would hang past the bottom of
            // the scrollable body up above its dot, so the text is never
            // clipped by the popover edge. The tip is display:none until it is
            // shown, so this runs on hover/focus, when it has a real box.
            function positionStatusTip(el) {
                el.classList.remove("tip-above");
                const tip = el.querySelector(".provider-status-tip");
                if (!tip) {
                    return;
                }
                const container = body.getBoundingClientRect();
                if (tip.getBoundingClientRect().bottom > container.bottom - 2) {
                    el.classList.add("tip-above");
                }
            }

            // providerAgeMarkup renders the freshness label. A stale label is
            // amber and gets the same custom tooltip as the dot (hover or
            // focus), with no inline text added to the card.
            function providerAgeMarkup(provider) {
                const stale = providerStaleNow(provider);
                const label = providerAgeLabel(provider);
                if (!stale) {
                    return `<span class="provider-updated" data-updated-at="${escapeHTML(provider.updated_at_time || '')}" data-updated-fallback="${escapeHTML(provider.updated_at || '')}" data-stale-after="${escapeHTML(String(provider.stale_after_seconds || 0))}">${escapeHTML(label)}</span>`;
                }
                const tooltip = providerStaleTooltip(provider);
                return `<span class="provider-age" tabindex="0" role="img" aria-label="${escapeHTML(tooltip)}" data-updated-at="${escapeHTML(provider.updated_at_time || '')}" data-stale-after="${escapeHTML(String(provider.stale_after_seconds || 0))}" data-stale-tooltip="${escapeHTML(tooltip)}">
                    <span class="provider-updated is-stale" data-updated-at="${escapeHTML(provider.updated_at_time || '')}" data-updated-fallback="${escapeHTML(provider.updated_at || '')}" data-stale-after="${escapeHTML(String(provider.stale_after_seconds || 0))}">${escapeHTML(label)}</span>
                    <span class="provider-status-tip" role="tooltip" aria-hidden="true">${escapeHTML(tooltip)}</span>
                </span>`;
            }

            // standardHeaderMarkup keeps the icon next to a normally colored
            // name, then a compact right cluster with the freshness label and a
            // status dot whose tooltip carries the status.
            function standardHeaderMarkup(provider) {
                return `
                    <div class="provider-header">
                        <div class="provider-copy">
                            <span class="provider-icon ${escapeHTML(providerIconClass(provider))}" aria-hidden="true"></span>
                            <span class="provider-name">${escapeHTML(provider.label)}</span>
                            ${provider.promo ? `<a class="promo-tag ${isPromoOffPeak(provider.promo) ? 'promo-offpeak' : 'promo-peak'}" href="https://www.reddit.com/r/ClaudeAI/comments/1s4idaq/update_on_session_limits/" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${escapeHTML(promoLabel(provider.promo))}</a>` : ''}
                        </div>
                        <span class="provider-meta">
                            ${providerAgeMarkup(provider)}
                            ${providerStatusMarkup(provider)}
                        </span>
                    </div>
 ${provider.base_provider === "mistral" && provider.subtitle ? `<div class="quota-detail-meta">${escapeHTML(provider.subtitle)}</div>` : ""}
 ${provider.base_provider === 'mistral' ? mistralRecovery.markup(provider.connection, provider.connection_status) : ''}
                `;
            }

            function renderDetailedCard(provider) {
                return `
                    <article class="provider-card provider-card-detailed status-${escapeHTML(provider.status || "healthy")}">
                        ${providerHeaderMarkup(provider)}
                        <div class="quota-detail-stack">
                            ${providerQuotas(provider).map((quota) => renderDetailedQuota(quota)).join("")}
                        </div>
                    </article>
                `;
            }

            function sourceTagMarkup(quota) {
                if (quota.is_stale) return '<span class="quota-source-tag">Stale data</span>';
                if (!quota.source || quota.source !== 'api') return '';
                const age = quota.age_seconds || 0;
                let ageText = '';
                if (age > 0 && age < 3600) ageText = Math.floor(age / 60) + 'm ago';
                else if (age >= 3600) ageText = Math.floor(age / 3600) + 'h ago';
                return `<span class="quota-source-tag">API${ageText ? `<span class="source-age">${escapeHTML(ageText)}</span>` : ''}</span>`;
            }

            function renderStandardQuota(quota) {
                const percent = clampPercent(quota.percent);
                const usage = usageSummary(quota);
                const statusNote = quotaStatusNote(quota);
                const label = fullQuotaLabel(quota);
                const fullLabel = label + statusNote;
                const fullValue = usage ? `${usage} used` : `${Math.round(percent)}%`;
                const reset = compactResetLabel(quota);
                const resetTitle = `Resets ${quota.time_until_reset || quota.reset_at || 'unknown'}`;
                return `
                    <div class="quota-tile status-${escapeHTML(quota.status || "healthy")}">
                        ${ringMarkup(percent, fullLabel, reset, resetTitle)}
                        <span class="quota-tile-label" title="${escapeHTML(fullLabel)}">${escapeHTML(label)}</span>
                        ${usage ? `<span class="quota-tile-usage" title="${escapeHTML(fullValue)}">${escapeHTML(usage)}</span>` : ''}
                    </div>
                `;
            }

            // ringMarkup draws the percent and the reset countdown inside the
            // ring; the full label and usage live below the ring as tile text.
            function ringMarkup(percent, fullLabel, reset, resetTitle) {
                const circumference = 2 * Math.PI * 15.5;
                const dash = (percent / 100) * circumference;
                return `
                    <div class="quota-ring">
                        <svg class="quota-meter" viewBox="0 0 40 40" aria-hidden="true">

            function normalizePreferences(raw) {

                    default_view: normalizeView(raw && raw.default_view),
                    refresh_seconds: Math.max(parseInt(raw && raw.refresh_seconds, 10) || 60, 10),

                    visible_providers: normalizeStringList(raw && raw.visible_providers),

            function normalizeStatusDisplay(raw) {

                const providerID = raw && typeof raw.provider_id === "string" ? raw.provider_id : "";
                const quotaKey = raw && typeof raw.quota_key === "string" ? raw.quota_key : "";

                const normalizedMode = mode === "provider_specific" ? "multi_provider" : mode;
                if (!statusDisplayOptions.some((option) => option.mode === normalizedMode)) {

            function normalizeStatusSelections(values, legacyProviderID = "", legacyQuotaKey = "") {
                const rawValues = Array.isArray(values) ? values : [];
                const seen = new Set();
                const selections = [];
                for (const value of rawValues) {
                    const providerID = String(value && value.provider_id ? value.provider_id : "").trim();
                    const quotaKey = String(value && value.quota_key ? value.quota_key : "").trim();
                    if (!providerID) {

                    const key = `${providerID}::${quotaKey}`;
                    if (seen.has(key)) {

                    .map((value) => String(value || "").trim())
                    .filter((value) => value && !seen.has(value) && seen.add(value));
            }

            function mergeProviderOrder(order, availableIDs) {
                const wanted = normalizeStringList(order);
                const available = normalizeStringList(availableIDs);
                const seen = new Set();
                const merged = [];
                for (const id of wanted) {
                    if (available.includes(id) && !seen.has(id)) {
                        seen.add(id);
                        merged.push(id);
                    }
                }
                for (const id of available) {
                    if (!seen.has(id)) {
                        seen.add(id);
                        merged.push(id);
                    }
                }
                return merged;
            }

            function sortByProviderOrder(items, order) {
                const available = items.map((item) => item.id);
                const mergedOrder = mergeProviderOrder(order, available);
                const indexByID = new Map(mergedOrder.map((id, index) => [id, index]));
                return items.sort((left, right) => {
                    const leftOrder = indexByID.has(left.id) ? indexByID.get(left.id) : Number.MAX_SAFE_INTEGER;
                    const rightOrder = indexByID.has(right.id) ? indexByID.get(right.id) : Number.MAX_SAFE_INTEGER;
                    if (leftOrder !== rightOrder) {

            function writeStoredProviderOrder(order) {

                }

                        provider_label: provider.label,

            function statusSelectionKey(selection) {

                    return "provider-icon-minimax";
                case "copilot":
                    return "provider-icon-copilot";
                case "antigravity":
                    return "provider-icon-antigravity";
                case "gemini":
                    return "provider-icon-gemini";
                case "zai":
                    return "provider-icon-zai";
                case "synthetic":
                    return "provider-icon-synthetic";
                case "grok":
                    return "provider-icon-grok";
                case "kimi":
                    return "provider-icon-kimi";
                case "mistral":
 return "provider-icon-mistral";
 case "opencode":
                    return "provider-icon-opencode";
                case "ollama":
                    return "provider-icon-ollama";
                case "muse":
                    return "provider-icon-muse";
                case "commandcode":
                    return "provider-icon-commandcode";
                case "moonshot":

            function aggregateAlertCount(snapshot) {

            function detailedMeta(quota) {
                const meta = [];
                if (Number.isFinite(Number(quota.current_rate)) && Number(quota.current_rate) > 0) {
                    meta.push(`Rate: ${formatRate(quota.current_rate)}/hr`);
                }
                if (Number.isFinite(Number(quota.projected_value)) && Number(quota.projected_value) > 0) {
