name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        run: |
          go fmt ./...
          go vet ./...

      - name: Test with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic -count=1 ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: go build -o onwatch .

  tray-linux:
    runs-on: ubuntu-latest
    name: Tray Linux

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test tagged tray packages
        # -race needs cgo for the test binary; the tray itself stays pure Go,
        # which the CGO_ENABLED=0 cross-compile step below proves.
        run: |
          go vet -tags menubar ./...
          go test -race -tags menubar -count=1 ./internal/menubar ./internal/web .

      - name: Cross-compile tray binaries
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux GOARCH=amd64 go build -tags menubar -o /tmp/onwatch-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -tags menubar -o /tmp/onwatch-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -tags menubar -o /tmp/onwatch-windows-amd64.exe .

  tray-windows:
    runs-on: windows-latest
    name: Tray Windows

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test tagged tray packages
        env:
          CGO_ENABLED: "0"
        run: |
          go test -tags menubar -count=1 ./internal/menubar
          go build -tags menubar -o onwatch-tray.exe .

  menubar-macos:
    runs-on: macos-15
    name: Menubar macOS

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compile tagged menubar packages
        run: |
          go test -tags menubar ./internal/menubar ./internal/web
          CGO_LDFLAGS="-framework UniformTypeIdentifiers" go build -tags menubar,desktop,production -o /tmp/onwatch-menubar .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install E2E dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/e2e/requirements.txt
          python -m playwright install chromium

      - name: Run menubar browser tests
        env:
          CGO_LDFLAGS: -framework UniformTypeIdentifiers
          ONWATCH_E2E_GO_BUILD_TAGS: menubar,desktop,production
        run: |
          cd tests/e2e
          pytest tests/test_menubar.py -v
