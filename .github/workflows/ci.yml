name: CI

# Every job runs in parallel on its own runner, so wall time is the slowest
# job, not the sum. "CI OK" at the bottom depends on all of them and is the
# single check to require on main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the older, now-stale run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # Vet every shipped OS and build-tag combination from one runner, so a
      # file that only compiles on one platform cannot slip through.
      - name: go vet (all platforms)
        run: |
          for os in linux darwin windows; do
            echo "== GOOS=$os"
            GOOS=$os go vet ./...
          done
          GOOS=linux go vet -tags menubar ./...
          GOOS=windows go vet -tags menubar ./...

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            race: "-race"
            tags: menubar
          - name: macOS
            os: macos-15
            race: "-race"
            tags: menubar
          # The race detector needs cgo, which the Windows runner lacks.
          - name: Windows
            os: windows-latest
            race: ""
            tags: menubar

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        shell: bash
        run: go test ${{ matrix.race }} -timeout 15m -coverprofile=coverage.out -covermode=atomic -count=1 ./...

      # The tray companion is compiled only with -tags menubar.
      - name: Test tray packages
        shell: bash
        env:
          CGO_LDFLAGS: ${{ runner.os == 'macOS' && '-framework UniformTypeIdentifiers' || '' }}
        run: go test ${{ matrix.race }} -timeout 15m -tags ${{ matrix.tags }} -count=1 ./internal/menubar ./internal/web ./cmd/onwatch

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Alpine is what the shell Docker image runs on: musl libc and busybox
  # instead of glibc and coreutils.
  test-alpine:
    runs-on: ubuntu-latest
    name: Test (Alpine)
    timeout-minutes: 30
    container: golang:1.25-alpine

    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: go test -timeout 15m -count=1 ./...

  # Build every release artifact exactly as release.yml does, so a PR cannot
  # break the release pipeline.
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64, cgo: "0", tags: menubar }
          - { os: ubuntu-latest, goos: linux, goarch: arm64, cgo: "0", tags: menubar }
          - { os: ubuntu-latest, goos: windows, goarch: amd64, cgo: "0", tags: menubar }
          - { os: ubuntu-latest, goos: windows, goarch: arm64, cgo: "0", tags: menubar }
          - { os: macos-15, goos: darwin, goarch: amd64, cgo: "1", tags: "menubar,desktop,production" }
          - { os: macos-15, goos: darwin, goarch: arm64, cgo: "1", tags: "menubar,desktop,production" }

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -tags ${{ matrix.tags }} -ldflags="-s -w" -o onwatch-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/onwatch

  e2e:
    name: E2E (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, tags: menubar }
          - { name: macOS, os: macos-15, tags: "menubar,desktop,production" }
          - { name: Windows, os: windows-latest, tags: menubar }

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install E2E dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/e2e/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run E2E suite
        shell: bash
        env:
          CGO_LDFLAGS: ${{ runner.os == 'macOS' && '-framework UniformTypeIdentifiers' || '' }}
          ONWATCH_E2E_GO_BUILD_TAGS: ${{ matrix.tags }}
        run: |
          cd tests/e2e
          pytest -v

      - name: Show onWatch logs
        if: failure()
        shell: bash
        run: |
          python - <<'EOF'
          import glob, os, tempfile
          for path in sorted(glob.glob(os.path.join(tempfile.gettempdir(), "onwatch-e2e-*.log"))):
              print(f"===== {path}")
              with open(path, errors="replace") as f:
                  print("".join(f.readlines()[-150:]))
          EOF

  installer:
    name: Installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: macOS, os: macos-15 }
          - { name: Windows, os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Test install.sh
        if: runner.os != 'Windows'
        run: bash tests/test_install.sh

      # 5.1 is what ships with Windows and what `irm ... | iex` runs, and it is
      # the host where redirected native stderr under ErrorActionPreference=Stop
      # becomes a terminating NativeCommandError. 7 keeps the script honest for
      # anyone who upgraded.
      - name: Test install.ps1 under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\test_install_ps1.ps1

      - name: Test install.ps1 under PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tests\test_install_ps1.ps1

  docker:
    runs-on: ubuntu-latest
    name: Docker
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build --target runtime-shell -t onwatch:ci-shell .
          docker build --target runtime -t onwatch:ci .

      # Start each image and wait for the dashboard. Z.ai points at a closed
      # local port, so the container makes no outbound provider calls.
      - name: Smoke test images
        run: |
          for image in onwatch:ci-shell onwatch:ci; do
            name=smoke-${image//[:.]/-}
            docker run -d --name "$name" -p 19300:9211 \
              -e ONWATCH_ADMIN_PASS=ci-smoke -e ZAI_API_KEY=ci -e ZAI_BASE_URL=http://127.0.0.1:1 \
              "$image"
            ok=""
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null http://localhost:19300/login; then ok=1; break; fi
              sleep 1
            done
            docker logs "$name" | tail -40
            docker rm -f "$name"
            if [ -z "$ok" ]; then echo "$image did not serve /login"; exit 1; fi
          done

  # Catches flake.nix drift such as a stale vendorHash after go.sum changes.
  nix:
    runs-on: ubuntu-latest
    name: Nix
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Build
        run: nix build .#onwatch --print-build-logs

  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, test, test-alpine, build, e2e, installer, docker, nix]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "A required job did not pass:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
